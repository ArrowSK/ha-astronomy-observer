[package]
name = "astronomy-observer"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
description = "Observing condition and target ranking service for Home Assistant"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
sgp4 = { version = "2.4", features = ["serde"] }
tiny_http = "0.12"
ureq = { version = "3", features = ["json"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
