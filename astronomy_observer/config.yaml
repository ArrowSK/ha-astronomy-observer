name: Astronomy Observer
description: Observing conditions and target recommendations for amateur astronomy
version: "0.1.0"
slug: astronomy_observer
url: https://github.com/ArrowSK/ha-astronomy-observer
image: ghcr.io/arrowsk/ha-astronomy-observer
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
stage: experimental
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:telescope
panel_title: Astronomy Observer
panel_admin: true
watchdog: tcp://[HOST]:[PORT:8099]
map:
  - type: addon_config
    read_only: true
options:
  primary_person: ""
  refresh_minutes: 30
  forecast_days: 7
  observing_window_hours: 14
  minimum_target_altitude: 20
  good_observing_threshold: 70
  telescope_aperture_mm: 200
  binocular_aperture_mm: 50
  horizon_mask: "0:0,45:0,90:0,135:0,180:0,225:0,270:0,315:0"
  sqm_override: 0.0
  sqm_entity: ""
  light_pollution_file: "light_pollution.csv"
  nearby_dark_site_radius_km: 75
  enable_satellites: true
  enable_aurora: true
  enable_comets: true
  external_location_precision: 3
schema:
  primary_person: str
  refresh_minutes: int(10,180)
  forecast_days: int(2,7)
  observing_window_hours: int(8,18)
  minimum_target_altitude: int(0,60)
  good_observing_threshold: int(1,100)
  telescope_aperture_mm: int(0,1000)
  binocular_aperture_mm: int(0,200)
  horizon_mask: str
  sqm_override: float(0,23)
  sqm_entity: str
  light_pollution_file: str
  nearby_dark_site_radius_km: int(0,300)
  enable_satellites: bool
  enable_aurora: bool
  enable_comets: bool
  external_location_precision: int(2,5)
