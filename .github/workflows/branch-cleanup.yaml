name: One-time branch cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete verified merged topic branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for branch in initial-implementation license-canonical-text; do
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" >/dev/null 2>&1; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
              echo "deleted ${branch}"
            else
              echo "already absent: ${branch}"
            fi
          done
