name: Apply 0.2.3 journal update once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-023-once.yaml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Apply journal deletion and navigation update
        run: python3 .github/scripts/release_023.py

      - name: Format Rust
        run: cargo fmt --manifest-path astronomy_observer/Cargo.toml

      - name: Validate updated repository
        run: |
          python3 -m pip install --disable-pip-version-check pyyaml
          python3 tests/validate_repository.py
          python3 -m py_compile tests/validate_repository.py

      - name: Commit directly to main
        run: |
          git config user.name "ArrowSK"
          git config user.email "56678503+ArrowSK@users.noreply.github.com"
          git add -A
          git commit -m "Release Astronomy Observer 0.2.3"
          git push origin HEAD:main
