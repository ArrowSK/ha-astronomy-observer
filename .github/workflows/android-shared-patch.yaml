name: Apply Android shared-runtime adaptations

on:
  push:
    branches:
      - feature/android-standalone

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7.0.1
        with:
          ref: feature/android-standalone

      - name: Apply minimal shared-runtime changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/apply_shared_patch.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'pub fn sample_nearest(samples: &[AstronomySample], time: DateTime<Utc>) -> Option<&AstronomySample> {',
              'pub fn sample_nearest(samples: &[AstronomySample], t: DateTime<Utc>) -> Option<&AstronomySample> {',
          )
          path.write_text(text, encoding='utf-8')
          PY
          python3 android/apply_shared_patch.py

      - name: Commit shared-runtime changes
        run: |
          rm android/apply_shared_patch.py
          rm .github/workflows/android-shared-patch.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Share runtime with standalone Android"
          git push origin HEAD:feature/android-standalone
