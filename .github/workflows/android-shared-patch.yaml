name: Apply Android shared-runtime adaptations

on:
  push:
    branches:
      - feature/android-standalone

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7.0.1
        with:
          ref: feature/android-standalone

      - name: Apply minimal shared-runtime changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/apply_shared_patch.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'pub fn sample_nearest(samples: &[AstronomySample], time: DateTime<Utc>) -> Option<&AstronomySample> {',
              'pub fn sample_nearest(samples: &[AstronomySample], t: DateTime<Utc>) -> Option<&AstronomySample> {',
          )
          marker = 'ci = root / ".github/workflows/ci.yaml"'
          if marker in text:
              text = text[:text.index(marker)] + '\nprint("shared Android adaptations applied")\n'
          path.write_text(text, encoding='utf-8')
          PY
          python3 android/apply_shared_patch.py

      - name: Commit only runtime changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            astronomy_observer/src/astro.rs \
            astronomy_observer/src/engine.rs \
            astronomy_observer/src/light_pollution.rs \
            astronomy_observer/src/weather.rs \
            astronomy_observer/config.yaml \
            astronomy_observer/Dockerfile
          git diff --cached --check
          git commit -m "Share runtime with standalone Android"
          git push origin HEAD:feature/android-standalone
