name: Validate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Repository and runtime
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install validation dependencies
        run: python3 -m pip install --disable-pip-version-check pyyaml

      - name: Validate repository
        run: python3 tests/validate_repository.py

      - name: Check Python tools
        run: python3 -m py_compile astronomy_observer/scripts/build_catalog.py tools/light_pollution_tile.py tests/validate_repository.py

      - name: Install Rust 1.89 toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt,clippy

      - name: Select Rust 1.89
        run: rustup default 1.89.0

      - name: Generate dependency lock file
        run: cargo generate-lockfile --manifest-path astronomy_observer/Cargo.toml

      - name: Upload dependency lock file
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: astronomy_observer/Cargo.lock

      - name: Check Rust formatting
        id: rustfmt
        run: |
          cargo fmt --manifest-path astronomy_observer/Cargo.toml --all
          git diff --check
          git diff --exit-code

      - name: Save formatting patch on failure
        if: failure() && steps.rustfmt.outcome == 'failure'
        run: git diff > rustfmt.patch

      - name: Upload formatting patch
        if: failure() && steps.rustfmt.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-patch
          path: rustfmt.patch

      - name: Run Clippy
        run: cargo clippy --manifest-path astronomy_observer/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path astronomy_observer/Cargo.toml

      - name: Build release runtime
        run: cargo build --manifest-path astronomy_observer/Cargo.toml --release

      - name: Run runtime self-test
        run: astronomy_observer/target/release/astronomy-observer --self-test

      - name: Compile pinned Astronomy Engine helper
        env:
          ASTRONOMY_ENGINE_COMMIT: 61dc07020aaa6885d2c7f688a4d82beaf6edb9ef
        run: |
          mkdir -p /tmp/astronomy-engine
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/cosinekitty/astronomy/${ASTRONOMY_ENGINE_COMMIT}/source/c/astronomy.c" \
            -o /tmp/astronomy-engine/astronomy.c
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/cosinekitty/astronomy/${ASTRONOMY_ENGINE_COMMIT}/source/c/astronomy.h" \
            -o /tmp/astronomy-engine/astronomy.h
          cc -O2 -Wall -Wextra -Werror \
            -I/tmp/astronomy-engine \
            astronomy_observer/scripts/astro_helper.c \
            /tmp/astronomy-engine/astronomy.c \
            -lm -o /tmp/astro-helper
