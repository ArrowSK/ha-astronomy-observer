name: Validate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Repository and runtime
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install validation dependencies
        run: python3 -m pip install --disable-pip-version-check pyyaml

      - name: Validate repository
        run: python3 tests/validate_repository.py

      - name: Validate standalone web packaging
        run: python3 webapp/validate.py

      - name: Validate bundled light-pollution atlas
        run: python3 tests/validate_atlas.py

      - name: Check Python tools
        run: python3 -m py_compile astronomy_observer/scripts/build_catalog.py astronomy_observer/scripts/build_global_atlas.py tools/light_pollution_tile.py tests/validate_repository.py tests/validate_atlas.py webapp/validate.py

      - name: Validate catalogue builder conversions
        run: python3 astronomy_observer/scripts/build_catalog.py --self-test

      - name: Validate bundled atlas builder
        run: python3 astronomy_observer/scripts/build_global_atlas.py --self-test

      - name: Validate AppArmor profile syntax
        run: |
          if ! command -v apparmor_parser >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y apparmor-utils
          fi
          sudo apparmor_parser -Q astronomy_observer/apparmor.txt

      - name: Install Rust 1.89 toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt,clippy

      - name: Select Rust 1.89
        run: rustup default 1.89.0

      - name: Check Rust formatting
        id: rustfmt
        run: |
          cargo fmt --manifest-path astronomy_observer/Cargo.toml --all
          git diff --check
          git diff --exit-code

      - name: Save formatting patch on failure
        if: failure() && steps.rustfmt.outcome == 'failure'
        run: git diff > rustfmt.patch

      - name: Upload formatting patch
        if: failure() && steps.rustfmt.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-patch
          path: rustfmt.patch

      - name: Run Clippy
        run: cargo clippy --locked --manifest-path astronomy_observer/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --locked --manifest-path astronomy_observer/Cargo.toml

      - name: Build release runtime
        run: cargo build --locked --manifest-path astronomy_observer/Cargo.toml --release

      - name: Run runtime self-test
        run: astronomy_observer/target/release/astronomy-observer --self-test

      - name: Compile pinned Astronomy Engine helper
        env:
          ASTRONOMY_ENGINE_COMMIT: 61dc07020aaa6885d2c7f688a4d82beaf6edb9ef
        run: |
          mkdir -p /tmp/astronomy-engine
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/cosinekitty/astronomy/${ASTRONOMY_ENGINE_COMMIT}/source/c/astronomy.c" \
            -o /tmp/astronomy-engine/astronomy.c
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/cosinekitty/astronomy/${ASTRONOMY_ENGINE_COMMIT}/source/c/astronomy.h" \
            -o /tmp/astronomy-engine/astronomy.h
          cc -O2 -Wall -Wextra \
            -Wno-error=unused-parameter \
            -Wno-error=missing-field-initializers \
            -I/tmp/astronomy-engine \
            -c /tmp/astronomy-engine/astronomy.c \
            -o /tmp/astronomy.o
          cc -O2 -Wall -Wextra -Werror \
            -I/tmp/astronomy-engine \
            -c astronomy_observer/scripts/astro_helper.c \
            -o /tmp/astro-helper.o
          cc /tmp/astro-helper.o /tmp/astronomy.o -lm -o /tmp/astro-helper
