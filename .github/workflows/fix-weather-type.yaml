name: Fix weather type alias

on:
  push:
    branches:
      - initial-implementation

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7.0.1
        with:
          ref: initial-implementation

      - name: Add type aliases
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("astronomy_observer/src/weather.rs")
          text = path.read_text()
          anchor = "use ureq::Agent;\n"
          aliases = "\ntype AirQualitySample = (Option<f64>, Option<f64>, Option<f64>);\ntype AirQualityByTime = HashMap<i64, AirQualitySample>;\n"
          if "type AirQualityByTime" not in text:
              text = text.replace(anchor, anchor + aliases, 1)
          path.write_text(text)
          PY
          cargo fmt --manifest-path astronomy_observer/Cargo.toml --all

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add astronomy_observer/src/weather.rs
          git commit -m "Define weather air-quality cache aliases"
          git push origin HEAD:initial-implementation
