name: One-time target image usability updater

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-time-target-image-lightbox.yaml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          ref: main

      - name: Apply shared target image lightbox UX
        run: python3 .github/scripts/one_time_target_image_patch.py

      - name: Validate the change
        run: |
          python3 tests/validate_repository.py
          python3 tests/validate_object_images.py
          python3 android/validate.py
          python3 android/prepare_assets.py
          grep -q 'id="image-lightbox"' android/generated/assets/index.html
          grep -q 'class="target-credit"' android/generated/assets/index.html
          grep -q 'class="target-thumb-wrap target-thumb-button"' android/generated/assets/index.html

      - name: Commit the usability change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add astronomy_observer/web/index.html tests/validate_object_images.py README.md astronomy_observer/DOCS.md docs/ANDROID.md
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Improve target image viewing"
          git push origin HEAD:main
