name: Build bundled light-pollution atlas

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-light-pollution-atlas.yaml
      - astronomy_observer/scripts/build_global_atlas.py

permissions:
  contents: write

concurrency:
  group: bundled-light-pollution-atlas
  cancel-in-progress: false

jobs:
  build-atlas:
    name: Build compact World Atlas grid
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true

      - name: Install atlas build dependencies
        run: python3 -m pip install --disable-pip-version-check numpy rasterio

      - name: Validate atlas builder
        run: python3 astronomy_observer/scripts/build_global_atlas.py --self-test

      - name: Download World Atlas 2015
        run: |
          curl --fail --location --retry 4 --retry-delay 5 \
            "https://datapub.gfz-potsdam.de/download/10.5880.GFZ.1.4.2016.001/World_Atlas_2015.zip" \
            --output /tmp/World_Atlas_2015.zip
          test "$(stat -c %s /tmp/World_Atlas_2015.zip)" -gt 600000000

      - name: Extract source GeoTIFF
        run: |
          mkdir -p /tmp/world-atlas
          unzip -j /tmp/World_Atlas_2015.zip '*.tif' -d /tmp/world-atlas
          test -s /tmp/world-atlas/World_Atlas_2015.tif

      - name: Build three-arcminute global grid
        run: |
          python3 astronomy_observer/scripts/build_global_atlas.py \
            --input /tmp/world-atlas/World_Atlas_2015.tif \
            --output astronomy_observer/data/world_atlas_3min.bin \
            --metadata astronomy_observer/data/world_atlas_3min.json \
            --factor 6
          size="$(stat -c %s astronomy_observer/data/world_atlas_3min.bin)"
          test "$size" -gt 20000000
          test "$size" -lt 60000000

      - name: Commit generated atlas when changed
        run: |
          if [ -z "$(git status --porcelain -- astronomy_observer/data/world_atlas_3min.bin astronomy_observer/data/world_atlas_3min.json)" ]; then
            echo "Bundled atlas is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add astronomy_observer/data/world_atlas_3min.bin astronomy_observer/data/world_atlas_3min.json
          git commit -m "Bundle coarse World Atlas light-pollution grid"
          git push origin HEAD:main
