              heading = '# Changelog\n\n'
              if heading not in text:
                  raise SystemExit(f'changelog heading missing in {changelog}')
              write(changelog, text.replace(heading, heading + section, 1))

          old_readme = 'Each accepted thumbnail keeps its own source, creator, licence and attribution in the bundled manifest and credits page. Tap or click a thumbnail to expand it for a proper look — especially useful on a phone — and close the full-screen view with the × button, the backdrop or Escape. The separate **i** credit control sits below the thumbnail so it does not compete with the image tap target. The credits page includes a clear return control in embedded views, while external source and licence links open separately. If a target has no accepted image, the interface simply falls back to the normal astronomy marker.'
          new_readme = 'Each accepted thumbnail keeps its own source, creator, licence and attribution in the bundled manifest and credits page. The bundled files deliberately remain compact. In Home Assistant and standalone web, opening a target can request a larger Wikimedia Commons preview using the same licence allow-list, and deep-sky/NGC/IC targets, comets and the ISS can request a small preview when no bundled image exists. Those lookups are optional, target-title-only and rely on the normal browser HTTP cache; they do not enlarge the installed image set or affect target ranking. If a lookup fails, the local thumbnail or normal astronomy marker remains in place.\n\nTap or click a thumbnail to expand it and close the full-screen view with the × button, the backdrop or Escape. The separate **i** credit control sits below the thumbnail so it does not compete with the image tap target. The Android edition intentionally keeps its embedded WebView local-only, so it continues to use the bundled previews and fallback marker without remote image lookup.'
          replace('README.md', old_readme, new_readme)

          privacy_old = "NOAA OVATION, CelesTrak and Minor Planet Center downloads are global datasets. Astronomy Observer does not put the observer's coordinates into those download URLs.\n\nThe World Atlas, meteor-shower table and reduced OpenNGC observing catalogue are local runtime resources and do not require a location request to a remote service."
          privacy_new = "NOAA OVATION, CelesTrak and Minor Planet Center downloads are global datasets. Astronomy Observer does not put the observer's coordinates into those download URLs.\n\nIn the Home Assistant and standalone web editions, target pictures may optionally be improved on demand through the English Wikipedia PageImages API and Wikimedia Commons image metadata. Those requests contain the target title or image filename, not the observing location. Images are accepted only after their Commons metadata reports Public Domain, CC0, CC BY or CC BY-SA. The Android embedded WebView keeps remote network loading disabled, so this optional image path is not used there.\n\nThe World Atlas, meteor-shower table and reduced OpenNGC observing catalogue are local runtime resources and do not require a location request to a remote service."
          replace('docs/PRIVACY.md', privacy_old, privacy_new)

          if 'THUMB_MAX = 192' not in read('astronomy_observer/scripts/build_object_thumbnails.py'):
              raise SystemExit('bundled thumbnail size changed unexpectedly')
          for required in ('TARGET_PREVIEW_FULL_PX = 1280', 'hydrateMissingTargetThumbnails', 'remoteTargetPreviewsAllowed', 'id="image-lightbox-meta"'):
              if required not in read(ui_path):
                  raise SystemExit(f'missing UI marker: {required}')
          PY

      - name: Validate changed source
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          python tests/validate_repository.py
          python webapp/validate.py
          python android/validate.py
          python tests/validate_object_images.py
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('astronomy_observer/web/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          if not scripts:
              raise SystemExit('no inline UI script found')
          Path('/tmp/astronomy-observer-ui.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/astronomy-observer-ui.js
          cargo test --locked --manifest-path astronomy_observer/Cargo.toml
          git diff --check
          grep -q 'THUMB_MAX = 192' astronomy_observer/scripts/build_object_thumbnails.py

      - name: Commit directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md docs/PRIVACY.md \
            astronomy_observer/CHANGELOG.md astronomy_observer/config.yaml astronomy_observer/Dockerfile \
            astronomy_observer/src/web.rs astronomy_observer/web/index.html webapp/src/server.rs \
            android/app/build.gradle.kts android/build-apk.sh \
            android/app/src/main/java/com/arrowsk/astronomyobserver/AndroidBridge.java \
            .github/workflows/android.yaml
          git diff --cached --stat
          git commit -m "Improve target image previews"
          git push origin HEAD:main
