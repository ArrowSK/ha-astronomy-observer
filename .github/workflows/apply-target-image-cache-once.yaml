  }
}'''
          if old_open not in ui:
              raise SystemExit('lightbox open handler marker not found')
          ui = ui.replace(old_open, new_open, 1)
          old_close = "  $('image-lightbox-caption').textContent = '';\n  $('image-lightbox-credit').removeAttribute('href');\n  document.body.classList.remove('image-lightbox-open');"
          new_close = "  $('image-lightbox-caption').textContent = '';\n  $('image-lightbox-meta').textContent = '';\n  $('image-lightbox-credit').removeAttribute('href');\n  $('image-lightbox-credit').removeAttribute('target');\n  $('image-lightbox-credit').removeAttribute('rel');\n  document.body.classList.remove('image-lightbox-open');"
          if old_close not in ui:
