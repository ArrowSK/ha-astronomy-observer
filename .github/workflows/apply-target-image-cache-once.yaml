name: Apply lean target previews once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-target-image-cache-once.yaml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply lean target preview enhancement
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')

          def read(path):
              return (root / path).read_text(encoding='utf-8')

          def write(path, text):
              (root / path).write_text(text, encoding='utf-8')

          def replace(path, old, new, count=1):
              text = read(path)
              if old not in text:
                  raise SystemExit(f'marker not found in {path}: {old[:100]!r}')
              write(path, text.replace(old, new, count))

          # 0.3.4 release metadata. Do not enlarge the bundled 192 px image set.
          replace('astronomy_observer/config.yaml', 'version: "0.3.3"', 'version: "0.3.4"')
          replace('astronomy_observer/Dockerfile', 'ARG BUILD_VERSION=0.3.3', 'ARG BUILD_VERSION=0.3.4')
          replace('android/app/build.gradle.kts', 'versionCode = 30300\n        versionName = "0.3.3"', 'versionCode = 30400\n        versionName = "0.3.4"')
          replace('android/build-apk.sh', '0.3.3', '0.3.4', -1)
          replace('.github/workflows/android.yaml', '0.3.3', '0.3.4', -1)
          replace('android/app/src/main/java/com/arrowsk/astronomyobserver/AndroidBridge.java', 'return "0.3.0";', 'return "0.3.4";')
          replace('README.md', '**Current release: 0.3.3.**', '**Current release: 0.3.4.**')

          # Only Wikimedia endpoints needed by optional runtime previews are added to HA/web CSP.
          old_csp = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'"
          new_csp = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://upload.wikimedia.org; connect-src 'self' https://en.wikipedia.org https://commons.wikimedia.org; frame-ancestors 'self'"
          replace('astronomy_observer/src/web.rs', old_csp, new_csp)
          replace('webapp/src/server.rs', old_csp, new_csp)

          ui_path = 'astronomy_observer/web/index.html'
          ui = read(ui_path)

          old_css = '''    .target-thumb-fallback { color: #7183a1; font-size: 25px; line-height: 1; }
    .target-credit { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; background: rgba(9,13,22,.84); color: #d8e4f8; border: 1px solid rgba(255,255,255,.28); text-decoration: none; font-size: 12px; font-weight: 700; }
    .target-credit:hover { background: #1a2840; color: var(--accent); }
    body.image-lightbox-open { overflow: hidden; }
    .image-lightbox[hidden] { display: none; }
    .image-lightbox { position: fixed; z-index: 100; inset: 0; display: flex; align-items: center; justify-content: center; padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); background: rgba(3,6,12,.94); }
    .image-lightbox-panel { position: relative; width: min(920px, 100%); max-height: calc(100dvh - 32px); display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .image-lightbox-image { width: min(820px, 100%); height: auto; max-width: 100%; max-height: calc(100dvh - 150px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); object-fit: contain; border-radius: 12px; border: 1px solid var(--line); background: #070b13; }
    .image-lightbox-caption { color: #c7d3e7; font-size: 14px; text-align: center; }
'''
          new_css = '''    .target-thumb-fallback { color: #7183a1; font-size: 25px; line-height: 1; }
    .target-thumb-button.image-loading::after { content: ""; position: absolute; z-index: 3; width: 18px; height: 18px; border: 2px solid rgba(238,243,255,.28); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
    .target-credit { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; background: rgba(9,13,22,.84); color: #d8e4f8; border: 1px solid rgba(255,255,255,.28); text-decoration: none; font-size: 12px; font-weight: 700; }
    .target-credit:hover { background: #1a2840; color: var(--accent); }
    body.image-lightbox-open { overflow: hidden; }
    .image-lightbox[hidden] { display: none; }
    .image-lightbox { position: fixed; z-index: 100; inset: 0; display: flex; align-items: center; justify-content: center; padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); background: rgba(3,6,12,.94); }
    .image-lightbox-panel { position: relative; width: min(1120px, 100%); max-height: calc(100dvh - 32px); display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .image-lightbox-image { width: auto; height: auto; max-width: 100%; max-height: calc(100dvh - 176px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); object-fit: contain; border-radius: 12px; border: 1px solid var(--line); background: #070b13; }
    .image-lightbox-caption { color: #c7d3e7; font-size: 14px; text-align: center; }
    .image-lightbox-meta { min-height: 18px; max-width: min(900px, 100%); color: var(--muted); font-size: 12px; line-height: 1.4; text-align: center; }
'''
          if old_css not in ui:
              raise SystemExit('target/lightbox CSS marker not found')
          ui = ui.replace(old_css, new_css, 1)

          old_markup = '''    <img id="image-lightbox-image" class="image-lightbox-image" alt="">
    <div id="image-lightbox-caption" class="image-lightbox-caption"></div>
    <a id="image-lightbox-credit" class="image-lightbox-credit" href="#" aria-label="Open image credit and licence">ⓘ <span>Image credit &amp; licence</span></a>'''
          new_markup = '''    <img id="image-lightbox-image" class="image-lightbox-image" alt="">
    <div id="image-lightbox-caption" class="image-lightbox-caption"></div>
    <div id="image-lightbox-meta" class="image-lightbox-meta" aria-live="polite"></div>
    <a id="image-lightbox-credit" class="image-lightbox-credit" href="#" aria-label="Open image credit and licence">ⓘ <span>Image credit &amp; licence</span></a>'''
          if old_markup not in ui:
              raise SystemExit('lightbox markup marker not found')
          ui = ui.replace(old_markup, new_markup, 1)

          helpers = r'''
const TARGET_PREVIEW_THUMB_PX = 256;
const TARGET_PREVIEW_FULL_PX = 1280;
const TARGET_PREVIEW_FAILURE_TTL_MS = 10 * 60 * 1000;
const targetPreviewCache = new Map();
const targetPreviewPending = new Map();
const targetPreviewMisses = new Map();
let targetImageManifestPromise = null;

function remoteTargetPreviewsAllowed() {
  return typeof window.AstronomyAndroid === 'undefined';
}

function enhancedTargetImageKey(r) {
  const name = String(r?.name || '').trim();
  const category = String(r?.category || '').toLowerCase();
  const messier = name.match(/(?:^|[^A-Za-z])M\s*0*(\d{1,3})(?=\b|\s|\()/i);
  if (messier) {
    const number = Number(messier[1]);
    if (number >= 1 && number <= 110) return `m${String(number).padStart(3, '0')}`;
  }
  const lower = name.toLowerCase();
  const planets = new Set(['mercury','venus','mars','jupiter','saturn','uranus','neptune']);
  if (category.includes('planet') && planets.has(lower)) return `planet-${lower}`;
  if (lower === 'moon') return 'moon';
  if (lower === 'milky way' || lower === 'galactic centre' || lower === 'galactic center') return 'milky-way';
  const meteors = {
    'perseids':'meteor-perseids', 'geminids':'meteor-geminids', 'quadrantids':'meteor-quadrantids',
    'lyrids':'meteor-lyrids', 'eta aquariids':'meteor-eta-aquariids', 'delta aquariids':'meteor-delta-aquariids',
    'orionids':'meteor-orionids', 'leonids':'meteor-leonids', 'taurids':'meteor-taurids', 'ursids':'meteor-ursids'
  };
  if (category.includes('meteor') && meteors[lower]) return meteors[lower];
  return null;
}

function targetImageLookupTitle(r) {
  const name = String(r?.name || '').replace(/\s+/g, ' ').trim();
  const category = String(r?.category || '').toLowerCase();
  if (!name) return null;
  const messier = name.match(/(?:^|[^A-Za-z])M\s*0*(\d{1,3})(?=\b|\s|\()/i);
  if (messier) return `Messier ${Number(messier[1])}`;
  const ngc = name.match(/\bNGC\s*0*(\d+)\b/i);
  if (ngc) return `NGC ${Number(ngc[1])}`;
  const ic = name.match(/\bIC\s*0*(\d+)\b/i);
  if (ic) return `IC ${Number(ic[1])}`;
  const lower = name.toLowerCase();
  const planets = new Set(['mercury','venus','mars','jupiter','saturn','uranus','neptune']);
  if (category.includes('planet') && planets.has(lower)) return lower === 'mercury' ? 'Mercury (planet)' : name;
  if (lower === 'moon') return 'Moon';
  if (lower === 'milky way' || lower.includes('galactic centre') || lower.includes('galactic center')) return 'Milky Way';
  if (category.includes('meteor') || category.includes('comet')) return name;
  if (category.includes('satellite') && /\bISS\b/i.test(name)) return 'International Space Station';
  if (category.includes('deep sky')) {
    const parts = name.split(/\s+[—–]\s+/);
    const common = parts.length > 1 ? parts.slice(1).join(' — ').replace(/\s*\([^)]*\)\s*$/, '').trim() : '';
    return common || name;
  }
  return null;
}

function cleanTargetImageMetadata(value) {
  if (!value) return '';
  const temp = document.createElement('div');
  temp.innerHTML = String(value);
  return String(temp.textContent || '').replace(/\s+/g, ' ').trim();
}

function allowedTargetImageLicense(value) {
  const normal = String(value || '').trim().toLowerCase();
  return normal === 'public domain' || normal.startsWith('cc0') || normal.startsWith('cc by ') || normal.startsWith('cc by-sa ');
}

async function targetPreviewJson(url) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 8000);
  try {
    const response = await fetch(url, {cache:'force-cache', signal:controller.signal});
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    return await response.json();
  } finally {
    clearTimeout(timer);
  }
}

async function targetImageManifest() {
  if (targetImageManifestPromise) return targetImageManifestPromise;
  targetImageManifestPromise = fetch('object-images/manifest.json', {cache:'force-cache'})
    .then(response => response.ok ? response.json() : null)
    .catch(() => null);
  return targetImageManifestPromise;
}

async function bundledTargetSourceFile(key) {
  if (!key) return null;
  const manifest = await targetImageManifest();
  const item = Array.isArray(manifest?.items) ? manifest.items.find(value => value?.key === key) : null;
  return item?.source_file || null;
}

function commonsSourceUrl(filename) {
  return `https://commons.wikimedia.org/wiki/File:${encodeURIComponent(String(filename || '').replaceAll(' ', '_'))}`;
}

async function resolveCommonsTargetImage(filename, size) {
  if (!filename || !remoteTargetPreviewsAllowed()) return null;
  const cacheKey = `commons:${size}:${String(filename).toLowerCase()}`;
  if (targetPreviewCache.has(cacheKey)) return targetPreviewCache.get(cacheKey);
  if (targetPreviewPending.has(cacheKey)) return targetPreviewPending.get(cacheKey);
  if ((targetPreviewMisses.get(cacheKey) || 0) > Date.now()) return null;

  const pending = (async () => {
    const params = new URLSearchParams({action:'query', format:'json', formatversion:'2', prop:'imageinfo', iiprop:'url|extmetadata', iiurlwidth:String(size), titles:`File:${filename}`, origin:'*'});
    const payload = await targetPreviewJson(`https://commons.wikimedia.org/w/api.php?${params}`);
    const page = payload?.query?.pages?.find(value => Array.isArray(value?.imageinfo) && value.imageinfo.length);
    const info = page?.imageinfo?.[0];
    if (!info) return null;
    const metadata = info.extmetadata || {};
    const license = cleanTargetImageMetadata(metadata?.LicenseShortName?.value);
    if (!allowedTargetImageLicense(license)) return null;
    const imageUrl = info.thumburl || info.url;
    if (!imageUrl) return null;
    const parsed = new URL(imageUrl);
    if (parsed.protocol !== 'https:' || parsed.hostname !== 'upload.wikimedia.org') return null;
    const creator = cleanTargetImageMetadata(metadata?.Artist?.value) || cleanTargetImageMetadata(metadata?.Credit?.value);
    const result = {filename, imageUrl, sourceUrl:commonsSourceUrl(filename), creator, license, creditText:[creator, license].filter(Boolean).join(' · ')};
    targetPreviewCache.set(cacheKey, result);
    return result;
  })().catch(() => null).then(result => {
    if (!result) targetPreviewMisses.set(cacheKey, Date.now() + TARGET_PREVIEW_FAILURE_TTL_MS);
    return result;
  }).finally(() => targetPreviewPending.delete(cacheKey));
  targetPreviewPending.set(cacheKey, pending);
  return pending;
}

async function resolveTargetImage(r, size) {
  if (!remoteTargetPreviewsAllowed()) return null;
  const bundledKey = enhancedTargetImageKey(r);
  if (bundledKey) {
    const filename = await bundledTargetSourceFile(bundledKey);
    if (filename) return resolveCommonsTargetImage(filename, size);
  }
  const title = targetImageLookupTitle(r);
  if (!title) return null;
  const cacheKey = `title:${size}:${title.toLowerCase()}`;
  if (targetPreviewCache.has(cacheKey)) return targetPreviewCache.get(cacheKey);
  if (targetPreviewPending.has(cacheKey)) return targetPreviewPending.get(cacheKey);
  if ((targetPreviewMisses.get(cacheKey) || 0) > Date.now()) return null;
  const pending = (async () => {
    const params = new URLSearchParams({action:'query', format:'json', formatversion:'2', redirects:'1', prop:'pageimages', piprop:'name', pilicense:'free', titles:title, origin:'*'});
    const payload = await targetPreviewJson(`https://en.wikipedia.org/w/api.php?${params}`);
    const filename = payload?.query?.pages?.find(value => value?.pageimage)?.pageimage;
    if (!filename) return null;
    const result = await resolveCommonsTargetImage(filename, size);
    if (result) targetPreviewCache.set(cacheKey, result);
    return result;
  })().catch(() => null).then(result => {
    if (!result) targetPreviewMisses.set(cacheKey, Date.now() + TARGET_PREVIEW_FAILURE_TTL_MS);
    return result;
  }).finally(() => targetPreviewPending.delete(cacheKey));
  targetPreviewPending.set(cacheKey, pending);
  return pending;
}

function preloadTargetImage(url) {
  return new Promise((resolve, reject) => {
    const image = new Image();
    image.onload = resolve;
    image.onerror = reject;
    image.src = url;
  });
}

function enhancedTargetThumbnail(r, index) {
  const key = enhancedTargetImageKey(r);
  const canRemote = remoteTargetPreviewsAllowed() && Boolean(targetImageLookupTitle(r));
  if (!key && !canRemote) return `<div class="target-media"><div class="target-thumb-wrap"><span class="target-thumb-fallback" aria-hidden="true">✦</span></div></div>`;
  const imagePath = key ? `object-images/${key}.webp` : '';
  const image = imagePath ? `<img class="target-thumb" src="${imagePath}" alt="${esc(r.name)}" loading="lazy" decoding="async" onerror="this.remove()">` : '';
  const creditPath = key ? `object-images/credits.html#${key}` : '';
  const credit = `<a class="target-credit" ${creditPath ? `href="${creditPath}"` : ''} ${creditPath ? '' : 'hidden'} title="Image credit and licence" aria-label="Image credit and licence for ${esc(r.name)}">i</a>`;
  return `<div class="target-media"><button class="target-thumb-wrap target-thumb-button" type="button" data-target-index="${index}" ${key ? `data-target-key="${key}"` : ''} ${imagePath ? `data-target-image="${imagePath}"` : ''} data-target-name="${esc(r.name)}" ${creditPath ? `data-target-credit="${creditPath}"` : ''} aria-label="Open image of ${esc(r.name)}"><span class="target-thumb-fallback" aria-hidden="true">✦</span>${image}</button>${credit}</div>`;
}

async function hydrateMissingTargetThumbnails(recommendations) {
  if (!remoteTargetPreviewsAllowed()) return;
  const jobs = recommendations.map((target, index) => ({target, index})).filter(({target}) => !enhancedTargetImageKey(target) && targetImageLookupTitle(target));
  let cursor = 0;
  async function worker() {
    while (cursor < jobs.length) {
      const job = jobs[cursor++];
      const button = document.querySelector(`#target-list .target-thumb-button[data-target-index="${job.index}"]`);
      if (!button || button.querySelector('.target-thumb')) continue;
      button.classList.add('image-loading');
      try {
        const remote = await resolveTargetImage(job.target, TARGET_PREVIEW_THUMB_PX);
        if (!remote || !button.isConnected || button.querySelector('.target-thumb')) continue;
        await preloadTargetImage(remote.imageUrl);
        if (!button.isConnected || button.querySelector('.target-thumb')) continue;
        const image = document.createElement('img');
        image.className = 'target-thumb';
        image.src = remote.imageUrl;
        image.alt = job.target.name || '';
        image.loading = 'lazy';
        image.decoding = 'async';
        button.appendChild(image);
        button.dataset.targetRemoteImage = remote.imageUrl;
        button.dataset.targetSourceFile = remote.filename;
        button.dataset.targetRemoteCredit = remote.sourceUrl;
        button.dataset.targetRemoteMeta = remote.creditText || remote.license || 'Wikimedia Commons';
        const credit = button.parentElement?.querySelector('.target-credit');
        if (credit) {
          credit.href = remote.sourceUrl;
          credit.target = '_blank';
          credit.rel = 'external noreferrer';
          credit.hidden = false;
          credit.title = remote.creditText || 'Image source and licence';
        }
      } catch (_) {
        // Keep the normal astronomy marker on any lookup/download failure.
      } finally {
        if (button.isConnected) button.classList.remove('image-loading');
      }
    }
  }
  await Promise.all([worker(), worker()]);
}
'''
          marker = 'let currentSnapshot = null;\n\nconst conditionHelp = {'
          if marker not in ui:
              raise SystemExit('shared UI insertion marker not found')
          ui = ui.replace(marker, 'let currentSnapshot = null;\n' + helpers + '\nconst conditionHelp = {', 1)

          if '      ${targetThumbnail(r)}\n' not in ui:
              raise SystemExit('target thumbnail call marker not found')
          ui = ui.replace('      ${targetThumbnail(r)}\n', '      ${enhancedTargetThumbnail(r, i)}\n', 1)
          old_target_end = "    </div>`).join('') : '<div class=\"muted\">No worthwhile targets cleared the current observing limits.</div>';\n\n  const detailedNights"
          if old_target_end not in ui:
              raise SystemExit('target list end marker not found')
          ui = ui.replace(old_target_end, "    </div>`).join('') : '<div class=\"muted\">No worthwhile targets cleared the current observing limits.</div>';\n  void hydrateMissingTargetThumbnails(snapshot.recommendations);\n\n  const detailedNights", 1)

          old_open = '''function openTargetImage(button) {
  const src = button.dataset.targetImage;
  if (!src) return;
  lastTargetImageTrigger = button;
  $('image-lightbox-image').src = src;
  $('image-lightbox-image').alt = button.dataset.targetName || 'Astronomy target';
  $('image-lightbox-caption').textContent = button.dataset.targetName || '';
  const credit = button.dataset.targetCredit || '#';
  $('image-lightbox-credit').href = credit;
  $('image-lightbox-credit').hidden = !button.dataset.targetCredit;
  $('image-lightbox').hidden = false;
  document.body.classList.add('image-lightbox-open');
  $('image-lightbox-close').focus();
}'''
          new_open = r'''async function openTargetImage(button) {
  const index = Number(button.dataset.targetIndex);
  const target = Number.isInteger(index) ? currentSnapshot?.recommendations?.[index] : null;
  const initialSrc = button.dataset.targetRemoteImage || button.dataset.targetImage || '';
  if (!initialSrc && !target) return;
  lastTargetImageTrigger = button;
  if (initialSrc) $('image-lightbox-image').src = initialSrc;
  else $('image-lightbox-image').removeAttribute('src');
  $('image-lightbox-image').alt = button.dataset.targetName || 'Astronomy target';
  $('image-lightbox-caption').textContent = button.dataset.targetName || '';
  const initialCredit = button.dataset.targetRemoteCredit || button.dataset.targetCredit || '';
  if (initialCredit) $('image-lightbox-credit').href = initialCredit;
  else $('image-lightbox-credit').removeAttribute('href');
  $('image-lightbox-credit').hidden = !initialCredit;
  $('image-lightbox-credit').target = button.dataset.targetRemoteCredit ? '_blank' : '_self';
  if (button.dataset.targetRemoteCredit) $('image-lightbox-credit').rel = 'external noreferrer';
  else $('image-lightbox-credit').removeAttribute('rel');
  $('image-lightbox-meta').textContent = button.dataset.targetRemoteMeta || (remoteTargetPreviewsAllowed() && target ? 'Loading a clearer licence-verified preview…' : '');
  $('image-lightbox').hidden = false;
  document.body.classList.add('image-lightbox-open');
  $('image-lightbox-close').focus();
  if (!remoteTargetPreviewsAllowed() || !target) return;
  try {
