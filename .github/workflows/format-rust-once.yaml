name: Format Rust once

on:
  push:
    paths:
      - .github/workflows/format-rust-once.yaml

permissions:
  contents: write

jobs:
  format:
    name: Apply repository Rust formatting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true

      - name: Install Rust 1.89 formatter
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt

      - name: Select Rust 1.89
        run: rustup default 1.89.0

      - name: Format Rust source
        run: cargo fmt --manifest-path astronomy_observer/Cargo.toml --all

      - name: Commit formatting when needed
        run: |
          if git diff --quiet -- astronomy_observer/src; then
            echo "Rust source is already formatted."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add astronomy_observer/src
          git commit -m "Apply Rust formatting"
          git push origin HEAD:main
