# Temporary one-time workflow. A small merged README trigger will run it, then this file is removed.
name: Fix credit navigation once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-credit-navigation-once.yaml"
      - "README.md"

permissions:
  contents: write

jobs:
  patch:
    name: Patch bundled credit navigation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply navigation fix and release bump
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace(path, old, new, *, count=None):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text and old not in text:
                  return
              if old not in text:
                  raise SystemExit(f'Expected marker not found in {path}: {old[:100]!r}')
              text = text.replace(old, new) if count is None else text.replace(old, new, count)
              write(p, text)

          head_old = '<title>Object image credits · Astronomy Observer</title><style>'
          head_new = '<title>Object image credits · Astronomy Observer</title><base target="_blank"><style>'
          style_old = 'a{color:#9ec5ff}.muted{color:#9eabc1;font-size:13px}</style></head>'
          style_new = (
              'a{color:#9ec5ff}.muted{color:#9eabc1;font-size:13px}'
              '.return-bar{position:fixed;z-index:20;top:0;left:0;right:0;display:flex;align-items:center;gap:14px;'
              'min-height:64px;padding:calc(10px + env(safe-area-inset-top)) 18px 10px;background:rgba(9,13,22,.96);'
              'border-bottom:1px solid #28344a;backdrop-filter:blur(12px)}'
              '.return-bar a{display:inline-flex;align-items:center;min-height:44px;padding:8px 12px;border:1px solid #28344a;'
              'border-radius:9px;background:#172033;color:#eef3ff;text-decoration:none;font-weight:650}'
              '.return-bar a:hover{border-color:#4d607f;background:#1a2840}.return-bar span{color:#9eabc1;font-size:13px}'
              'main{padding-top:calc(96px + env(safe-area-inset-top))}'
              'article{scroll-margin-top:calc(92px + env(safe-area-inset-top))}'
              '@media(max-width:520px){.return-bar span{display:none}}'</n              '</style></head>'
          )
          body_old = '<body><main><h1>Object image credits</h1>'
          body_new = (
              '<body><nav class="return-bar" aria-label="Credit page navigation">'
              '<a id="credits-back" target="_self" href="../#targets" '
              'onclick="if(location.protocol===\'file:\'){this.href=\'../index.html#targets\';}">← Back to Astronomy Observer</a>'
              '<span>Image credits and licences</span></nav><main><h1>Object image credits</h1>'
          )

          for path in [
              'astronomy_observer/data/object_images/credits.html',
              'astronomy_observer/scripts/build_object_thumbnails.py',
          ]:
              replace(path, head_old, head_new, count=1)
              replace(path, style_old, style_new, count=1)
              replace(path, body_old, body_new, count=1)

          validator = Path('tests/validate_object_images.py')
          text = validator.read_text(encoding='utf-8')
          marker = '    notice = (IMAGES / "NOTICE.txt").read_text(encoding="utf-8")\n'
          addition = (
              marker
              + '    for navigation_marker in [\'<base target="_blank">\', "Back to Astronomy Observer", \'target="_self"\', "../#targets"]:\n'
              + '        require(navigation_marker in credits, f"credit-page navigation marker missing: {navigation_marker}")\n'
          )
          if 'credit-page navigation marker missing' not in text:
              if marker not in text:
                  raise SystemExit('Object-image validator insertion marker missing')
              text = text.replace(marker, addition, 1)
              validator.write_text(text, encoding='utf-8')

          replace('astronomy_observer/config.yaml', 'version: "0.3.1"', 'version: "0.3.2"', count=1)
          replace('astronomy_observer/Dockerfile', 'ARG BUILD_VERSION=0.3.1', 'ARG BUILD_VERSION=0.3.2', count=1)
          replace('android/app/build.gradle.kts', 'versionCode = 30100', 'versionCode = 30200', count=1)
          replace('android/app/build.gradle.kts', 'versionName = "0.3.1"', 'versionName = "0.3.2"', count=1)
          for path in ['android/validate.py', 'android/build-apk.sh', '.github/workflows/android.yaml']:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if '0.3.1' not in text:
                  raise SystemExit(f'Expected 0.3.1 release marker missing from {path}')
              p.write_text(text.replace('0.3.1', '0.3.2'), encoding='utf-8')

          changelog = Path('astronomy_observer/CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          release = '''# Changelog\n\n## 0.3.2 - 2026-08-18\n\n- Added an always-visible **Back to Astronomy Observer** control to the bundled object-image credits page, so Home Assistant Ingress, Android and standalone web users are never left on a dead-end attribution page.\n- Credit-page source and licence links now open separately instead of replacing the embedded Astronomy Observer view.\n- Kept all target images, image licences, target ranking, scoring and observing behaviour unchanged.\n\n'''
          if '## 0.3.2 - 2026-08-18' not in text:
              if not text.startswith('# Changelog\n\n'):
                  raise SystemExit('Unexpected changelog header')
              changelog.write_text(release + text[len('# Changelog\n\n'):], encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace('> **Current release: 0.3.1.**', '> **Current release: 0.3.2.**', 1)
          text = text.replace(
              'Each accepted thumbnail keeps its own source, creator, licence and attribution in the bundled manifest and credits page. If a target has no accepted image, the interface simply falls back to the normal astronomy marker.',
              'Each accepted thumbnail keeps its own source, creator, licence and attribution in the bundled manifest and credits page. The credits page has its own return control for embedded views, while external source and licence links open separately. If a target has no accepted image, the interface simply falls back to the normal astronomy marker.',
              1,
          )
          text = text.replace(
              'The scoring model is deterministic. No LLM, remote scoring service or news-sentiment model sits in the decision path.',
              'The scoring model is deterministic and does not depend on a remote scoring or news-sentiment service.',
              1,
          )
          readme.write_text(text, encoding='utf-8')

          ha_readme = Path('astronomy_observer/README.md')
          text = ha_readme.read_text(encoding='utf-8')
          old = 'The header keeps the refresh icon directly available and places **Setup** and the **Observation journal** in a hamburger menu with generous touch spacing.'
          new = 'The header keeps the refresh icon directly available and places **Setup** and the **Observation journal** in a hamburger menu with generous touch spacing. Bundled object-image credits include a visible return control, and attribution links open separately so the Home Assistant Ingress view is not replaced.'
          if new not in text:
              if old not in text:
                  raise SystemExit('HA README navigation marker missing')
              text = text.replace(old, new, 1)
          ha_readme.write_text(text, encoding='utf-8')
          print('Credit navigation hotfix prepared')
          PY

      - name: Validate patched repository
        run: |
          python3 tests/validate_object_images.py
          python3 tests/validate_repository.py
          python3 webapp/validate.py
          python3 android/validate.py

      - name: Verify only intended release/navigation files changed
        run: |
          git diff --check
          git status --short
          git diff --name-only | sort

      - name: Commit hotfix to main
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            astronomy_observer/data/object_images/credits.html \
            astronomy_observer/scripts/build_object_thumbnails.py \
            tests/validate_object_images.py \
            astronomy_observer/config.yaml \
            astronomy_observer/Dockerfile \
            android/app/build.gradle.kts \
            android/validate.py \
            android/build-apk.sh \
            .github/workflows/android.yaml \
            astronomy_observer/CHANGELOG.md \
            README.md \
            astronomy_observer/README.md
          git commit -m "Fix embedded image-credit navigation"
          git push origin HEAD:main
