name: Fix credit navigation once

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/fix-credit-navigation-once.yaml"

permissions:
  contents: write

jobs:
  patch:
    name: Patch bundled credit navigation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Apply navigation fix and release bump
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"marker missing in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, count), encoding="utf-8")

          head_old = '<title>Object image credits · Astronomy Observer</title><style>'
          head_new = '<title>Object image credits · Astronomy Observer</title><base target="_blank"><style>'
          style_old = 'a{color:#9ec5ff}.muted{color:#9eabc1;font-size:13px}</style></head>'
          style_new = (
              'a{color:#9ec5ff}.muted{color:#9eabc1;font-size:13px}'
              '.return-bar{position:fixed;z-index:20;top:0;left:0;right:0;display:flex;align-items:center;gap:14px;'
              'min-height:64px;padding:calc(10px + env(safe-area-inset-top)) 18px 10px;background:rgba(9,13,22,.96);'
              'border-bottom:1px solid #28344a;backdrop-filter:blur(12px)}'
              '.return-bar a{display:inline-flex;align-items:center;min-height:44px;padding:8px 12px;border:1px solid #28344a;'
              'border-radius:9px;background:#172033;color:#eef3ff;text-decoration:none;font-weight:650}'
              '.return-bar a:hover{border-color:#4d607f;background:#1a2840}.return-bar span{color:#9eabc1;font-size:13px}'
              'main{padding-top:calc(96px + env(safe-area-inset-top))}'
              'article{scroll-margin-top:calc(92px + env(safe-area-inset-top))}'
              '@media(max-width:520px){.return-bar span{display:none}}'
              '</style></head>'
          )
          body_old = '<body><main><h1>Object image credits</h1>'
          body_new = (
              '<body><nav class="return-bar" aria-label="Credit page navigation">'
              '<a id="credits-back" target="_self" href="../#targets" '
              'onclick="if(location.protocol===\'file:\'){this.href=\'../index.html#targets\';}">← Back to Astronomy Observer</a>'
              '<span>Image credits and licences</span></nav><main><h1>Object image credits</h1>'
          )

          for path in (
              'astronomy_observer/data/object_images/credits.html',
              'astronomy_observer/scripts/build_object_thumbnails.py',
          ):
              replace(path, head_old, head_new)
              replace(path, style_old, style_new)
              replace(path, body_old, body_new)

          p = Path('tests/validate_object_images.py')
          text = p.read_text(encoding='utf-8')
          marker = '    notice = (IMAGES / "NOTICE.txt").read_text(encoding="utf-8")\n'
          check = (
              '    for navigation_marker in [\'<base target="_blank">\', "Back to Astronomy Observer", '
              '\'target="_self"\', "../#targets"]:\n'
              '        require(navigation_marker in credits, f"credit-page navigation marker missing: {navigation_marker}")\n'
          )
          if 'credit-page navigation marker missing' not in text:
              if marker not in text:
                  raise SystemExit('validator insertion marker missing')
              p.write_text(text.replace(marker, marker + check, 1), encoding='utf-8')

          replace('astronomy_observer/config.yaml', 'version: "0.3.1"', 'version: "0.3.2"')
          replace('astronomy_observer/Dockerfile', 'ARG BUILD_VERSION=0.3.1', 'ARG BUILD_VERSION=0.3.2')
          replace('android/app/build.gradle.kts', 'versionCode = 30100', 'versionCode = 30200')
          replace('android/app/build.gradle.kts', 'versionName = "0.3.1"', 'versionName = "0.3.2"')
          for path in ('android/validate.py', 'android/build-apk.sh', '.github/workflows/android.yaml'):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if '0.3.2' not in text:
                  if '0.3.1' not in text:
                      raise SystemExit(f'release marker missing in {path}')
                  p.write_text(text.replace('0.3.1', '0.3.2'), encoding='utf-8')

          p = Path('astronomy_observer/CHANGELOG.md')
          text = p.read_text(encoding='utf-8')
          if '## 0.3.2 - 2026-08-18' not in text:
              entry = '''# Changelog\n\n## 0.3.2 - 2026-08-18\n\n- Added an always-visible **Back to Astronomy Observer** control to object-image credits, including deep-linked entries opened inside Home Assistant Ingress.\n- Wikimedia source and licence links now open separately instead of replacing the embedded Astronomy Observer view.\n- Kept all target images, image licences, target ranking, scoring and observing behaviour unchanged.\n\n'''
              if not text.startswith('# Changelog\n\n'):
                  raise SystemExit('unexpected changelog header')
              p.write_text(entry + text[len('# Changelog\n\n'):], encoding='utf-8')

          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace('> **Current release: 0.3.1.**', '> **Current release: 0.3.2.**', 1)
          text = text.replace(
              'Each accepted thumbnail keeps its own source, creator, licence and attribution in the bundled manifest and credits page. If a target has no accepted image, the interface simply falls back to the normal astronomy marker.',
              'Each accepted thumbnail keeps its own source, creator, licence and attribution in the bundled manifest and credits page. The credits page includes a clear return control in embedded views, while external source and licence links open separately. If a target has no accepted image, the interface simply falls back to the normal astronomy marker.',
              1,
          )
          text = text.replace(
              'The scoring model is deterministic. No LLM, remote scoring service or news-sentiment model sits in the decision path.',
              'The scoring model is deterministic and does not depend on a remote scoring or news-sentiment service.',
              1,
          )
          p.write_text(text, encoding='utf-8')

          p = Path('astronomy_observer/README.md')
          text = p.read_text(encoding='utf-8')
          old = 'The header keeps the refresh icon directly available and places **Setup** and the **Observation journal** in a hamburger menu with generous touch spacing.'
          new = old + ' Object-image credits include a visible return control, and external attribution links do not replace the Ingress view.'
          if new not in text:
              if old not in text:
                  raise SystemExit('HA README marker missing')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          print('credit navigation patch prepared')
          PY

      - name: Validate patched repository
        run: |
          python3 tests/validate_object_images.py
          python3 tests/validate_repository.py
          python3 webapp/validate.py
          python3 android/validate.py
          git diff --check

      - name: Commit hotfix to topic branch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            astronomy_observer/data/object_images/credits.html \
            astronomy_observer/scripts/build_object_thumbnails.py \
            tests/validate_object_images.py \
            astronomy_observer/config.yaml \
            astronomy_observer/Dockerfile \
            android/app/build.gradle.kts \
            android/validate.py \
            android/build-apk.sh \
            .github/workflows/android.yaml \
            astronomy_observer/CHANGELOG.md \
            README.md \
            astronomy_observer/README.md
          git commit -m "Fix embedded image-credit navigation"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"

# Retry after pre-aligning the Android workflow version so the bot does not need workflow-write permission.
