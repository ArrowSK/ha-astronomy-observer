name: Format thumbnail Rust once

on:
  push:
    branches:
      - feature/object-thumbnails
    paths:
      - ".github/workflows/format-thumbnail-rust-once.yaml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/object-thumbnails
      - name: Install pinned formatter
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt
      - name: Format shared Rust source
        run: cargo +1.89.0 fmt --manifest-path astronomy_observer/Cargo.toml --all
      - name: Commit formatter output
        run: |
          git add astronomy_observer/src/web.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply Rust formatting"
          git push origin HEAD:feature/object-thumbnails
