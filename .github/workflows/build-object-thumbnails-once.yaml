name: Build object thumbnails once

on:
  push:
    branches:
      - feature/object-thumbnails
    paths:
      - "astronomy_observer/scripts/build_object_thumbnails.py"
      - "astronomy_observer/scripts/apply_object_thumbnail_feature.py"
      - "tests/validate_object_images.py"
      - ".github/workflows/build-object-thumbnails-once.yaml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and commit licensed thumbnails
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          ref: feature/object-thumbnails

      - name: Install thumbnail dependency
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Build licensed image bundle if needed
        run: |
          if [ ! -f astronomy_observer/data/object_images/manifest.json ]; then
            python3 astronomy_observer/scripts/build_object_thumbnails.py
          else
            echo "Object thumbnail bundle already exists; keeping the reviewed pinned bundle."
          fi

      - name: Apply isolated UI and packaging changes
        run: python3 astronomy_observer/scripts/apply_object_thumbnail_feature.py

      - name: Validate generated thumbnail bundle
        run: python3 tests/validate_object_images.py

      - name: Commit generated bundle and feature changes
        run: |
          # Workflow-file edits are deliberately not staged here: GitHub's
          # ephemeral Actions token may update normal repository content but
          # cannot rewrite workflow files. Those small CI edits are committed
          # separately through the repository maintenance connection.
          git add astronomy_observer/data/object_images \
            astronomy_observer/web/index.html \
            astronomy_observer/src/web.rs \
            webapp/src/server.rs \
            astronomy_observer/Dockerfile webapp/Dockerfile \
            android/prepare_assets.py android/app/build.gradle.kts android/validate.py \
            astronomy_observer/config.yaml webapp/validate.py \
            README.md THIRD_PARTY_LICENSES.md docs/DATA_SOURCES.md docs/ANDROID.md \
            CHANGELOG.md astronomy_observer/CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add licensed target thumbnails"
          git push origin HEAD:feature/object-thumbnails
