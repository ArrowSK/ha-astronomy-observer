name: One-time expanded image sizing check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-time-target-image-upscale.yaml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - name: Make expanded target images actually large
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('astronomy_observer/web/index.html')
          text = p.read_text(encoding='utf-8')
          old = '.image-lightbox-image { max-width: 100%; max-height: calc(92vh - 68px); object-fit: contain; border-radius: 12px; border: 1px solid var(--line); background: #070b13; }'
          new = '.image-lightbox-image { width: min(720px, 92vw); height: auto; max-width: 100%; max-height: calc(92vh - 68px); object-fit: contain; border-radius: 12px; border: 1px solid var(--line); background: #070b13; }'
          if old not in text:
              raise SystemExit('lightbox image sizing marker changed')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate shared and Android UI
        run: |
          python3 tests/validate_repository.py
          python3 tests/validate_object_images.py
          python3 android/validate.py
          python3 android/prepare_assets.py
          grep -q 'width: min(720px, 92vw)' astronomy_observer/web/index.html
          grep -q 'width: min(720px, 92vw)' android/generated/assets/index.html
          git diff --check
      - name: Commit final image sizing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add astronomy_observer/web/index.html
          git commit -m "Make expanded target images mobile-readable"
          git push origin HEAD:main
