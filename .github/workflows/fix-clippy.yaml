name: Apply Clippy fixes

on:
  push:
    branches:
      - initial-implementation

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7.0.1
        with:
          ref: initial-implementation

      - name: Apply lint fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("astronomy_observer/src/astro.rs")
          text = path.read_text()
          text = text.replace(
              "pub fn sample_nearest<'a>(\n    samples: &'a [AstronomySample],\n    t: DateTime<Utc>,\n) -> Option<&'a AstronomySample> {",
              "pub fn sample_nearest(\n    samples: &[AstronomySample],\n    t: DateTime<Utc>,\n) -> Option<&AstronomySample> {",
          )
          path.write_text(text)

          for name, marker in (
              ("comets.rs", "pub fn recommendations("),
              ("meteors.rs", "pub fn recommendations("),
              ("targets.rs", "pub fn deep_sky("),
          ):
              path = Path("astronomy_observer/src") / name
              text = path.read_text()
              text = text.replace(marker, "#[allow(clippy::too_many_arguments)]\n" + marker, 1)
              path.write_text(text)

          path = Path("astronomy_observer/src/weather.rs")
          text = path.read_text()
          anchor = 'const USER_AGENT: &str = "AstronomyObserver/0.1 (+https://github.com/ArrowSK/ha-astronomy-observer)";\n'
          aliases = "\ntype AirQualitySample = (Option<f64>, Option<f64>, Option<f64>);\ntype AirQualityByTime = HashMap<i64, AirQualitySample>;\n"
          text = text.replace(anchor, anchor + aliases, 1)
          text = text.replace(
              "AppResult<HashMap<i64, (Option<f64>, Option<f64>, Option<f64>)>>",
              "AppResult<AirQualityByTime>",
          )
          path.write_text(text)
          PY

      - name: Format changed Rust source
        run: cargo fmt --manifest-path astronomy_observer/Cargo.toml --all

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add astronomy_observer/src
          git commit -m "Resolve strict Clippy findings"
          git push origin HEAD:initial-implementation
