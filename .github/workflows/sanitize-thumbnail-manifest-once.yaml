name: Sanitize thumbnail manifest once

on:
  push:
    branches:
      - feature/object-thumbnails
    paths:
      - ".github/workflows/sanitize-thumbnail-manifest-once.yaml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/object-thumbnails
      - name: Keep only attribution fields needed by the app
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          builder = Path('astronomy_observer/scripts/build_object_thumbnails.py')
          text = builder.read_text(encoding='utf-8')
          marker = '                "credit": metadata_value(metadata, "Credit"),\n'
          if marker not in text:
              raise SystemExit('builder credit marker not found')
          builder.write_text(text.replace(marker, '', 1), encoding='utf-8')

          manifest_path = Path('astronomy_observer/data/object_images/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          for item in manifest.get('items', []):
              item.pop('credit', None)
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Validate thumbnails
        run: python3 tests/validate_object_images.py
      - name: Commit cleanup
        run: |
          git add astronomy_observer/scripts/build_object_thumbnails.py astronomy_observer/data/object_images/manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Keep thumbnail attribution metadata concise"
          git push origin HEAD:feature/object-thumbnails
